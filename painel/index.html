<!doctype html>
<html lang="pt-BR" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Painel Nexum</title>
<link rel="icon" type="image/png" href="../img/emblema.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* ===== BLOCO 1: TOKENS (marca Elton Longaray) ===== */
:root{--bg:#F3F6FB;--surface:#FFFFFF;--sunk:#E8EEF7;--fg:#0E2138;--muted:#5B6A80;--line:#D8E1EE;--accent:#2F6FB3;--accent-ink:#FFFFFF;--accent-soft:#E1ECF8;--bad:#B23A2E;--font:"Manrope",ui-sans-serif,system-ui,"Segoe UI",sans-serif;--ease:cubic-bezier(0.22,1,0.36,1);color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#181818;--surface:#1F1F1F;--sunk:#272727;--fg:#E9EEF6;--muted:#93A2B8;--line:#313131;--accent:#6FB3D9;--accent-ink:#081420;--accent-soft:#16304F;--bad:#F08C80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:1rem;line-height:1.5rem}
.wrap{max-width:880px;margin:0 auto;padding:32px max(16px,env(safe-area-inset-right,0px)) 64px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:24px}
h1{margin:0;font-size:1.875rem;line-height:2.25rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:12px}
.mark .em{width:40px;height:40px;border-radius:12px;background:#FFFFFF;display:grid;place-items:center;border:1px solid var(--line)}
.mark .em img{width:28px}
.muted{color:var(--muted);font-size:.875rem;line-height:1.25rem}
.btn{font:600 1rem/1.5rem var(--font);padding:8px 12px;border-radius:8px;border:1px solid transparent;cursor:pointer;background:var(--accent);color:var(--accent-ink);transition:transform .5s var(--ease)}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.login{max-width:360px;display:flex;flex-direction:column;gap:12px}
.login input{font:1rem/1.5rem var(--font);padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.err{color:var(--bad);font-size:.875rem;line-height:1.25rem;min-height:1.25rem}
.pastas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pasta{text-align:left;font-family:var(--font);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .5s var(--ease),border-color .3s var(--ease)}
.pasta:hover{transform:translateY(-2px);border-color:var(--accent)}
.pasta b{font-size:1.125rem;line-height:1.75rem}
.cartao{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.cartao h2{margin:0;font-size:1.25rem;line-height:1.75rem}
.qa{display:flex;flex-direction:column;gap:4px}
.qa b{font-size:.875rem;line-height:1.25rem}
.qa p{margin:0;white-space:pre-wrap}
.qa p.vazio{color:var(--muted)}
.voltar{align-self:flex-start}
@media (max-width:560px){.pastas{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="mark"><span class="em"><img src="../img/emblema.png" alt=""></span><div><b>Painel Nexum</b><div class="muted">Respostas por setor</div></div></div>
    <button class="btn ghost" id="sair" hidden>Sair</button>
  </div>
  <div id="app"><p class="muted">Carregando</p></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== BLOCO 2: CONEXÃO =====
const sb = window.supabase.createClient("https://gopqajnivmbxjqsiznqi.supabase.co", "sb_publishable_YBF0cSQt0IlTqVhCyRlduQ_ij2CHBZ5");
const app = document.getElementById("app");
const SETORES = [["delce","Dr. Delce"],["recepcao","Recepção"],["medicos","Médicos veterinários"],["contador","Contador"]];
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const data = d => new Date(d).toLocaleString("pt-BR", { dateStyle:"short", timeStyle:"short" });
let linhas = [];

// ===== BLOCO 3: LOGIN (mesmo login do painel do diagnóstico) =====
function telaLogin(msg){
  document.getElementById("sair").hidden = true;
  app.innerHTML = `<div class="login"><h1>Entrar</h1>
    <input id="em" type="email" placeholder="E-mail" autocomplete="username">
    <input id="pw" type="password" placeholder="Senha" autocomplete="current-password">
    <p class="err">${esc(msg || "")}</p><button class="btn" id="ent">Entrar</button></div>`;
  const ir = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
    if(error) return telaLogin("E-mail ou senha incorretos.");
    carregar();
  };
  ent.onclick = ir; pw.onkeydown = e => { if(e.key === "Enter") ir(); };
}
document.getElementById("sair").onclick = async () => { await sb.auth.signOut(); telaLogin(); };

// ===== BLOCO 4: DADOS =====
async function carregar(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) return telaLogin();
  document.getElementById("sair").hidden = false;
  const { data:rows, error } = await sb.from("nexum_respostas").select("*").order("criado_em", { ascending:false });
  if(error) return app.innerHTML = `<p class="err">Erro ao carregar: ${esc(error.message)}. Já rodou o SQL da página sql.html?</p>`;
  linhas = rows || [];
  const s = location.hash.slice(1);
  SETORES.some(x => x[0] === s) ? telaSetor(s) : telaPastas();
}

// ===== BLOCO 5: PASTAS POR SETOR =====
function telaPastas(){
  history.replaceState(null, "", location.pathname);
  app.innerHTML = `<div class="pastas">${SETORES.map(([k, nome]) => {
    const n = linhas.filter(l => l.setor === k).length;
    const ult = linhas.find(l => l.setor === k);
    return `<button class="pasta" data-k="${k}"><b>${esc(nome)}</b><span class="muted">${n ? n + (n > 1 ? " respostas" : " resposta") + " · última em " + data(ult.criado_em) : "Nenhuma resposta ainda"}</span></button>`;
  }).join("")}</div>`;
  app.querySelectorAll(".pasta").forEach(b => b.onclick = () => telaSetor(b.dataset.k));
}

// ===== BLOCO 6: RESPOSTAS DE UM SETOR =====
function telaSetor(k){
  history.replaceState(null, "", "#" + k);
  const nome = SETORES.find(x => x[0] === k)[1];
  const rs = linhas.filter(l => l.setor === k);
  app.innerHTML = `<div style="display:flex;flex-direction:column;gap:16px">
    <button class="btn ghost voltar" id="volta">Voltar para as pastas</button>
    <h1>${esc(nome)}</h1>
    ${rs.length ? rs.map(r => `<div class="cartao"><div><h2>${esc(r.nome)}</h2><span class="muted">${data(r.criado_em)}</span></div>
      ${(r.respostas || []).map((x, i) => `<div class="qa"><b>${i + 1}. ${esc(x.p)}</b><p class="${x.r ? "" : "vazio"}">${x.r ? esc(x.r) : "Sem resposta"}</p></div>`).join("")}</div>`).join("")
      : `<p class="muted">Nenhuma resposta deste setor ainda. Quando alguém responder, aparece aqui.</p>`}</div>`;
  document.getElementById("volta").onclick = telaPastas;
}

carregar();
</script>
</body>
</html>
